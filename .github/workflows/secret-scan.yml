name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Basic secret pattern scan
        run: |
          echo "Scanning for common secret patterns..."
          if grep -R -n -E -i "(api[_-]?key|secret|token|password|private[_-]?key)\s*[=:]\s*['\"]?[A-Za-z0-9_\-]{20,}" --exclude-dir=.git --exclude="*.md" . ; then
            echo "Possible secrets found. Review carefully."
            exit 1
          else
            echo "No obvious secret patterns detected."
          fi
