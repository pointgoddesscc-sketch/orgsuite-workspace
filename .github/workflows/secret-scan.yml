name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scanner behavior
        run: bash .github/scripts/test-secret-scan.sh

      - name: Basic secret pattern scan
        run: bash .github/scripts/secret-scan.sh
