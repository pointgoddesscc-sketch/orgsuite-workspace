server {
  listen 80;
  server_name _;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Robots-Tag "noindex" always;

  location = /legal/thirdparty.com {
    return 301 /legal/facebook-notices/;
  }

  location = /legal/thirdpartynotices {
    return 301 /legal/facebook-notices/;
  }

  location /legal/facebook-notices/ {
    alias /usr/share/nginx/html/legal/facebook-notices/;
    index index.html;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Robots-Tag "noindex" always;
  }

  location = /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
